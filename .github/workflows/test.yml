name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install pytest

      # The suite is model-free by design (see tests/ conftest) — it runs
      # without WhisperX/Parakeet/NLLB models or a GPU.
      - name: Run unit tests
        run: python -m pytest tests/ -v
